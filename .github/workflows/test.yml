# Test automatici a ogni modifica: motore Python, motore JavaScript, parità tra i due, app e PWA.
# Girano sui server di GitHub, quindi l'esito è verificabile da chiunque (badge nel README).
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Dipendenze
        run: python -m pip install --upgrade pip pytest
      - name: Test Python (comprende la parità con JavaScript)
        run: python -m pytest -q
      - name: Test JavaScript
        working-directory: tests/js
        run: node --test --test-reporter=spec
